<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="center-page">

    <div class="simple-card">
        <!-- Clean Vector Illustration -->
        <div class="card-illustration">
            <svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" class="mini-svg">
                <!-- Soft background aura -->
                <circle cx="120" cy="90" r="70" fill="#e0e7ff"/>
                
                <!-- Screen / Laptop -->
                <rect x="65" y="45" width="110" height="75" rx="6" fill="#1e293b"/>
                <rect x="72" y="52" width="96" height="61" rx="3" fill="#4f46e5"/>
                
                <!-- Checkmark on screen -->
                <circle cx="120" cy="82" r="18" fill="#ffffff"/>
                <path d="M112 82 L118 88 L129 76" fill="none" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- Laptop base -->
                <polygon points="50,120 190,120 180,132 60,132" fill="#94a3b8"/>
                <rect x="105" y="122" width="30" height="3" rx="1.5" fill="#64748b"/>
                
                <!-- Confetti stars -->
                <circle cx="45" cy="55" r="4" fill="#fbbf24"/>
                <circle cx="195" cy="65" r="5" fill="#f43f5e"/>
                <circle cx="180" cy="35" r="3" fill="#10b981"/>
                <circle cx="55" cy="95" r="3" fill="#6366f1"/>
            </svg>
        </div>

        <h1>Welcome!</h1>
        <p>Login successful.</p>

        <a href="index.html" class="btn btn-primary">Logout</a>
    </div>

</body>
</html>
